---
apiVersion: v1
kind: Pod
metadata:
  name: source
  namespace: k3s-smoke
spec:
  nodeSelector:
    kubernetes.io/hostname: dkhundley-homelab-worker1
  containers:
    - name: toolbox
      image: busybox:1.36
      command: [sleep, "3600"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: destination
  namespace: k3s-smoke
spec:
  nodeSelector:
    kubernetes.io/hostname: dkhundley-homelab-worker2
  containers:
    - name: toolbox
      image: busybox:1.36
      command: [sleep, "3600"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi

