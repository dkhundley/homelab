---
- name: Check kubectl on the control node
  ansible.builtin.command:
    argv: [kubectl, version, --client]
  changed_when: false

- name: Wait for the controller API over the home LAN
  ansible.builtin.wait_for:
    host: "{{ k3s_controller_admin_endpoint }}"
    port: 6443
    timeout: 60
  when: not ansible_check_mode

- name: Read the controller administrator kubeconfig
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  delegate_to: "{{ groups['controllers'][0] }}"
  become: true
  register: controller_kubeconfig
  no_log: true

- name: Build the external administrator kubeconfig
  ansible.builtin.set_fact:
    external_kubeconfig: >-
      {{ controller_kubeconfig.content | b64decode
         | regex_replace('https://127\\.0\\.0\\.1:6443',
                         'https://' ~ k3s_controller_admin_endpoint ~ ':6443') }}
  no_log: true

- name: Require the external API endpoint in the kubeconfig
  ansible.builtin.assert:
    that:
      - "('https://' ~ k3s_controller_admin_endpoint ~ ':6443') in external_kubeconfig"
      - "'https://127.0.0.1:6443' not in external_kubeconfig"
    fail_msg: The controller kubeconfig did not contain the expected loopback endpoint.
  no_log: true

- name: Create the local kubeconfig directory
  ansible.builtin.file:
    path: "{{ k3s_kubeconfig_path | dirname }}"
    state: directory
    mode: '0700'

- name: Install the external administrator kubeconfig atomically
  ansible.builtin.copy:
    content: "{{ external_kubeconfig }}"
    dest: "{{ k3s_kubeconfig_path }}"
    mode: '0600'
  no_log: true
  diff: false

- name: Check the zsh startup file
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/.zshrc"
  register: zshrc_file

- name: Create a private zsh startup file when absent
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.zshrc"
    state: touch
    mode: '0600'
    modification_time: preserve
    access_time: preserve
  when: not zshrc_file.stat.exists

- name: Export the homelab kubeconfig for interactive zsh sessions
  ansible.builtin.lineinfile:
    path: "{{ lookup('env', 'HOME') }}/.zshrc"
    regexp: '^export KUBECONFIG=.*k3s-homelab\.yaml.*$'
    line: 'export KUBECONFIG="{{ k3s_kubeconfig_path }}"'
    create: false

- name: Verify the external kubeconfig
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ k3s_kubeconfig_path }}"
      - get
      - nodes
      - -o
      - wide
  changed_when: false
  when: not ansible_check_mode
