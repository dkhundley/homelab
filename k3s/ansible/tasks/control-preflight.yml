---
- name: Assert the fixed cluster topology
  ansible.builtin.assert:
    that:
      - groups['controllers'] | length == 1
      - groups['workers'] | length == 3
      - groups['k3s_cluster'] | length == 4
      - groups['controllers'][0] == 'dkhundley-homelab-controller'
      - groups['workers'] | sort == ['dkhundley-homelab-worker1', 'dkhundley-homelab-worker2', 'dkhundley-homelab-worker3']
    fail_msg: The inventory must contain the documented one-controller, three-worker topology.

- name: Check the SSH private key
  ansible.builtin.stat:
    path: "{{ ansible_ssh_private_key_file }}"
  register: homelab_ssh_key

- name: Require the SSH private key
  ansible.builtin.assert:
    that:
      - homelab_ssh_key.stat.exists
      - homelab_ssh_key.stat.isreg
    fail_msg: "Expected the homelab SSH key at {{ ansible_ssh_private_key_file }}."

- name: Check kubectl on the control node
  ansible.builtin.command:
    argv: [kubectl, version, --client]
  changed_when: false

- name: Resolve the controller administration endpoint
  ansible.builtin.command:
    argv:
      - dscacheutil
      - -q
      - host
      - -a
      - name
      - "{{ k3s_controller_admin_endpoint }}"
  changed_when: false
  register: controller_mdns

- name: Require a resolved controller administration endpoint
  ansible.builtin.assert:
    that:
      - controller_mdns.stdout | length > 0
      - hostvars[groups['controllers'][0]].k3s_node_ip not in controller_mdns.stdout
    fail_msg: >-
      The controller .local name must resolve over the home LAN, not to the isolated
      cluster Ethernet address.
