---
all:
  vars:
    ansible_user: dkhundley
    ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/homelab"
    ansible_python_interpreter: /usr/bin/python3
  children:
    k3s_cluster:
      children:
        controllers:
          hosts:
            dkhundley-homelab-controller:
              ansible_host: dkhundley-homelab-controller.local
              k3s_node_ip: 10.10.10.10
        workers:
          hosts:
            dkhundley-homelab-worker1:
              ansible_host: dkhundley-homelab-worker1.local
              k3s_node_ip: 10.10.10.11
            dkhundley-homelab-worker2:
              ansible_host: dkhundley-homelab-worker2.local
              k3s_node_ip: 10.10.10.12
            dkhundley-homelab-worker3:
              ansible_host: dkhundley-homelab-worker3.local
              k3s_node_ip: 10.10.10.13
              kubelet_system_reserved:
                cpu: 500m
                memory: 1Gi
              k3s_extra_node_labels:
                homelab-screen/display: deskpi

